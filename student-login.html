<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KLS VDIT Student Login — Access your hostel dashboard, submit leave requests, and view mess updates.">
  <title>Student Login — KLS VDIT Hostel Management System</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-page">
    <div class="login-container">

      <!-- College Branding Placeholder -->
      <div class="login-branding">
        <div id="loginCollegeLogoWrapper" class="login-branding-logo" aria-label="College logo placeholder" style="overflow: hidden; display: flex; align-items: center; justify-content: center;">
          <span id="loginLogoPlaceholderText">KLS<br>VDIT</span>
          <img id="loginCollegeLogoImg" src="" alt="College Logo" style="width: 100%; height: 100%; object-fit: contain; display: none;">
        </div>
        <h3 id="loginCollegeName">KLS Vishwanathrao Deshpande Institute of Technology (KLS VDIT), Haliyal</h3>
      </div>

      <!-- Login Card -->
      <div class="login-card">
        <div class="login-header">
          <div class="login-header-icon student" aria-hidden="true">
            <!-- Student icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/>
            </svg>
          </div>
          <h1>Student Login</h1>
          <p>Access your hostel dashboard</p>
        </div>

        <!-- Alert Error Message Container -->
        <div id="loginAlert" class="login-alert hidden" role="alert"></div>

        <form class="login-form" id="studentLoginForm" onsubmit="return false;" novalidate>
          <!-- USN -->
          <div class="form-group">
            <label for="student-usn" class="form-label">USN (University Seat Number)</label>
            <input
              type="text"
              id="student-usn"
              class="form-input"
              placeholder="e.g. 1AB22CS001"
              autocomplete="off"
            >
          </div>

          <!-- Course -->
          <div class="form-group">
            <label for="student-course" class="form-label">Course</label>
            <select id="student-course" class="form-select">
              <option value="" disabled selected>Select your course</option>
              <option value="btech">B.Tech</option>
              <option value="be">B.E.</option>
              <option value="bca">BCA</option>
              <option value="bsc">B.Sc</option>
              <option value="mtech">M.Tech</option>
              <option value="mca">MCA</option>
              <option value="msc">M.Sc</option>
              <option value="mba">MBA</option>
              <option value="other">Other</option>
            </select>
          </div>

          <!-- Semester -->
          <div class="form-group">
            <label for="student-semester" class="form-label">Semester</label>
            <select id="student-semester" class="form-select">
              <option value="" disabled selected>Select semester</option>
              <option value="1">1st Semester</option>
              <option value="2">2nd Semester</option>
              <option value="3">3rd Semester</option>
              <option value="4">4th Semester</option>
              <option value="5">5th Semester</option>
              <option value="6">6th Semester</option>
              <option value="7">7th Semester</option>
              <option value="8">8th Semester</option>
            </select>
          </div>

          <!-- Date of Birth -->
          <div class="form-group">
            <label for="student-dob" class="form-label">Date of Birth</label>
            <input
              type="date"
              id="student-dob"
              class="form-input"
            >
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="studentLoginBtn">
            Login as Student
          </button>
        </form>

        <!-- Footer links -->
        <div class="login-footer" style="display: flex; justify-content: space-between; gap: 10px; font-size: 13px;">
          <a href="warden-login.html" class="form-link">Warden Login</a>
          <a href="incharge-login.html" class="form-link">Incharge Login</a>
        </div>
      </div>

      <!-- Back to home -->
      <a href="index.html" class="login-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to Home
      </a>

    </div>
  </div>

  <!-- Firebase SDK (Compat Version for local file:// support) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=16.0"></script>
  <script src="js/auth-service.js?v=16.0"></script>
  <script src="js/firestore-service.js?v=16.0"></script>
  <script src="js/login-student.js?v=16.0"></script>

  <script src="js/main.js?v=16.0"></script>
</body>
</html>
